services:
  rooms-service:
    build: .
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: postgresql://room_service:room_service_dev@postgres:5432/chatvardage_rooms?schema=public
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:3001}
      AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-jeton-interne-local}
      MESSAGE_SERVICE_URL: ${MESSAGE_SERVICE_URL:-http://host.docker.internal:3004}
    ports:
      - "3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: room_service
      POSTGRES_PASSWORD: room_service_dev
      POSTGRES_DB: chatvardage_rooms
    ports:
      - "5432:5432"
    volumes:
      - rooms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_service -d chatvardage_rooms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rooms-postgres-data:
